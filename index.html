<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vitrine Digital - Ofertas Exclusivas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f5f7fa; color: #333; padding: 20px; }
    header { text-align: center; margin-bottom: 30px; padding: 20px 0; background: #ffffff; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
    h1 { color: #2c3e50; font-size: 1.8rem; margin-bottom: 8px; }
    p.sub { color: #666; font-size: 0.95rem; }
    
    .ofertas-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; max-width: 1000px; margin: 0 auto; }
    .card { background: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: transform 0.2s; border: 1px solid #e1e8ed; }
    .card:hover { transform: translateY(-4px); }
    .card-body { padding: 20px; text-align: center; }
    .card-title { font-size: 1.2rem; margin-bottom: 10px; color: #1a202c; }
    .card-desc { color: #4a5568; font-size: 0.9rem; margin-bottom: 15px; }
    .btn { display: inline-block; width: 100%; padding: 10px; background-color: #3182ce; color: white; font-weight: bold; text-decoration: none; border-radius: 6px; text-align: center; }
    .btn:hover { background-color: #2b6cb0; }
  </style>

  <!-- Script oficial do OneSignal SDK v16 -->
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
  <script>
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      await OneSignal.init({
        appId: "96898809-38c2-4067-abf2-30fcaaeb653e",
        serviceWorkerParam: { scope: "/vitrinedigital/" },
        serviceWorkerPath: "OneSignalSDKWorker.js",
        allowLocalhostAsSecureOrigin: true,
        promptOptions: {
          slidedown: {
            prompts: [
              {
                type: "push",
                autoPrompt: false,
                text: {
                  actionMessage: "Deseja receber notificações das nossas melhores ofertas e sorteios?",
                  acceptButton: "Sim, quero receber!",
                  cancelButton: "Agora não"
                }
              }
            ]
          }
        }
      });

      // Dispara o popup do OneSignal após 5 segundos
      setTimeout(async () => {
        try {
          await OneSignal.Slidedown.showSlidedownPrompt();
        } catch (err) {
          console.error("Erro ao exibir o popup do OneSignal:", err);
        }
      }, 5000);
    });
  </script>
</head>
<body>

  <header>
    <h1>🔥 Ofertas & Promoções Exclusivas</h1>
    <p class="sub">Aproveite os melhores descontos atualizados diariamente!</p>
  </header>

  <main class="ofertas-container">
    <div class="card">
      <div class="card-body">
        <h2 class="card-title">Oferta Especial #1</h2>
        <p class="card-desc">Confira os detalhes desta oportunidade e garanta seu desconto antes que acabe.</p>
        <a href="#" class="btn">Ver Oferta</a>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <h2 class="card-title">Oferta Especial #2</h2>
        <p class="card-desc">Mais uma seleção incrível de produtos com preços reduzidos.</p>
        <a href="#" class="btn">Ver Oferta</a>
      </div>
    </div>
  </main>

</body>
</html>
